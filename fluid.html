<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>2D Fluid Simulation</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0b0d12;
    color: #e6e9ef;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  h1 {
    font-size: 18px;
    font-weight: 500;
    margin: 0 0 12px;
    opacity: 0.9;
  }
  #controls {
    display: flex;
    flex-wrap: wrap;
    gap: 14px 22px;
    align-items: center;
    background: #161a22;
    border: 1px solid #232936;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 12px;
    max-width: 720px;
  }
  .control {
    display: flex;
    flex-direction: column;
    font-size: 12px;
    min-width: 140px;
  }
  .control label {
    margin-bottom: 4px;
    opacity: 0.75;
    letter-spacing: 0.3px;
  }
  .control input[type=range] {
    width: 160px;
    accent-color: #4f9eff;
  }
  .control .value {
    font-variant-numeric: tabular-nums;
    margin-left: 6px;
    opacity: 0.85;
  }
  button, select {
    background: #1f2530;
    color: #e6e9ef;
    border: 1px solid #2c3342;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover, select:hover {
    background: #28303d;
    border-color: #3a4357;
  }
  canvas {
    background: #000;
    border-radius: 10px;
    box-shadow: 0 12px 36px rgba(0,0,0,0.45);
    cursor: crosshair;
    touch-action: none;
    max-width: 100%;
  }
  .hint {
    font-size: 12px;
    opacity: 0.55;
    margin-top: 10px;
    text-align: center;
  }
</style>
</head>
<body>
  <h1>Двумерная симуляция жидкости (Stable Fluids)</h1>

  <div id="controls">
    <button id="reset">Сброс</button>

    <div class="control">
      <label>Вязкость <span class="value" id="viscValue">0.0000</span></label>
      <input type="range" id="viscosity" min="0" max="0.005" step="0.0001" value="0.0001">
    </div>

    <div class="control">
      <label>Диффузия <span class="value" id="diffValue">0.0000</span></label>
      <input type="range" id="diffusion" min="0" max="0.0005" step="0.00001" value="0.00005">
    </div>

    <div class="control">
      <label>Сила мазка <span class="value" id="forceValue">5</span></label>
      <input type="range" id="force" min="1" max="20" step="1" value="5">
    </div>

    <div class="control">
      <label>Палитра</label>
      <select id="palette">
        <option value="rainbow">Радуга</option>
        <option value="fire">Огонь</option>
        <option value="ocean">Океан</option>
        <option value="mono">Монохром</option>
        <option value="cycle">Авто-смена</option>
      </select>
    </div>
  </div>

  <canvas id="sim" width="512" height="512"></canvas>
  <div class="hint">Нажмите и двигайте мышью (или пальцем) по полю, чтобы добавить жидкости.</div>

<script>
(() => {
  const canvas = document.getElementById('sim');
  const ctx = canvas.getContext('2d');

  const N = 128;                  // sim grid resolution
  const SIZE = (N + 2) * (N + 2);
  const IX = (i, j) => i + (N + 2) * j;

  let visc = parseFloat(document.getElementById('viscosity').value);
  let diff = parseFloat(document.getElementById('diffusion').value);
  let forceScale = parseFloat(document.getElementById('force').value);
  let palette = 'rainbow';

  let u, v, u_prev, v_prev;
  let dR, dG, dB, dR_prev, dG_prev, dB_prev;

  function allocate() {
    u = new Float32Array(SIZE);
    v = new Float32Array(SIZE);
    u_prev = new Float32Array(SIZE);
    v_prev = new Float32Array(SIZE);
    dR = new Float32Array(SIZE);
    dG = new Float32Array(SIZE);
    dB = new Float32Array(SIZE);
    dR_prev = new Float32Array(SIZE);
    dG_prev = new Float32Array(SIZE);
    dB_prev = new Float32Array(SIZE);
  }
  allocate();

  // -- Stable Fluids (Jos Stam) --
  function set_bnd(b, x) {
    for (let i = 1; i <= N; i++) {
      x[IX(0,     i)] = b === 1 ? -x[IX(1, i)] : x[IX(1, i)];
      x[IX(N + 1, i)] = b === 1 ? -x[IX(N, i)] : x[IX(N, i)];
      x[IX(i, 0    )] = b === 2 ? -x[IX(i, 1)] : x[IX(i, 1)];
      x[IX(i, N + 1)] = b === 2 ? -x[IX(i, N)] : x[IX(i, N)];
    }
    x[IX(0, 0)]         = 0.5 * (x[IX(1, 0)] + x[IX(0, 1)]);
    x[IX(0, N + 1)]     = 0.5 * (x[IX(1, N + 1)] + x[IX(0, N)]);
    x[IX(N + 1, 0)]     = 0.5 * (x[IX(N, 0)] + x[IX(N + 1, 1)]);
    x[IX(N + 1, N + 1)] = 0.5 * (x[IX(N, N + 1)] + x[IX(N + 1, N)]);
  }

  function lin_solve(b, x, x0, a, c) {
    const invC = 1 / c;
    for (let k = 0; k < 12; k++) {
      for (let j = 1; j <= N; j++) {
        for (let i = 1; i <= N; i++) {
          x[IX(i, j)] = (x0[IX(i, j)] + a * (
            x[IX(i - 1, j)] + x[IX(i + 1, j)] +
            x[IX(i, j - 1)] + x[IX(i, j + 1)]
          )) * invC;
        }
      }
      set_bnd(b, x);
    }
  }

  function diffuse(b, x, x0, d, dt) {
    const a = dt * d * N * N;
    lin_solve(b, x, x0, a, 1 + 4 * a);
  }

  function advect(b, d, d0, uF, vF, dt) {
    const dt0 = dt * N;
    for (let j = 1; j <= N; j++) {
      for (let i = 1; i <= N; i++) {
        let x = i - dt0 * uF[IX(i, j)];
        let y = j - dt0 * vF[IX(i, j)];
        if (x < 0.5) x = 0.5;
        if (x > N + 0.5) x = N + 0.5;
        const i0 = Math.floor(x), i1 = i0 + 1;
        if (y < 0.5) y = 0.5;
        if (y > N + 0.5) y = N + 0.5;
        const j0 = Math.floor(y), j1 = j0 + 1;
        const s1 = x - i0, s0 = 1 - s1;
        const t1 = y - j0, t0 = 1 - t1;
        d[IX(i, j)] =
          s0 * (t0 * d0[IX(i0, j0)] + t1 * d0[IX(i0, j1)]) +
          s1 * (t0 * d0[IX(i1, j0)] + t1 * d0[IX(i1, j1)]);
      }
    }
    set_bnd(b, d);
  }

  function project(uF, vF, p, div) {
    const h = 1 / N;
    for (let j = 1; j <= N; j++) {
      for (let i = 1; i <= N; i++) {
        div[IX(i, j)] = -0.5 * h * (
          uF[IX(i + 1, j)] - uF[IX(i - 1, j)] +
          vF[IX(i, j + 1)] - vF[IX(i, j - 1)]
        );
        p[IX(i, j)] = 0;
      }
    }
    set_bnd(0, div);
    set_bnd(0, p);
    lin_solve(0, p, div, 1, 4);
    for (let j = 1; j <= N; j++) {
      for (let i = 1; i <= N; i++) {
        uF[IX(i, j)] -= 0.5 * (p[IX(i + 1, j)] - p[IX(i - 1, j)]) / h;
        vF[IX(i, j)] -= 0.5 * (p[IX(i, j + 1)] - p[IX(i, j - 1)]) / h;
      }
    }
    set_bnd(1, uF);
    set_bnd(2, vF);
  }

  function vel_step(uF, vF, u0, v0, viscosity, dt) {
    // add forces already injected into u/v from input
    let tmp;
    tmp = uF; // swap
    diffuse(1, u0, uF, viscosity, dt);
    diffuse(2, v0, vF, viscosity, dt);
    project(u0, v0, uF, vF);
    advect(1, uF, u0, u0, v0, dt);
    advect(2, vF, v0, u0, v0, dt);
    project(uF, vF, u0, v0);
  }

  function dens_step(x, x0, uF, vF, d, dt) {
    diffuse(0, x0, x, d, dt);
    advect(0, x, x0, uF, vF, dt);
  }

  // -- Rendering --
  const W = canvas.width, H = canvas.height;
  const image = ctx.createImageData(W, H);
  const cellW = W / N;
  const cellH = H / N;

  function render() {
    const data = image.data;
    for (let py = 0; py < H; py++) {
      const gy = py / cellH + 0.5;
      const j0 = Math.floor(gy);
      const fy = gy - j0;
      for (let px = 0; px < W; px++) {
        const gx = px / cellW + 0.5;
        const i0 = Math.floor(gx);
        const fx = gx - i0;
        const i1 = i0 + 1, j1 = j0 + 1;

        function bil(arr) {
          return (1 - fx) * (1 - fy) * arr[IX(i0, j0)]
               +      fx  * (1 - fy) * arr[IX(i1, j0)]
               + (1 - fx) *      fy  * arr[IX(i0, j1)]
               +      fx  *      fy  * arr[IX(i1, j1)];
        }
        const r = bil(dR), g = bil(dG), b = bil(dB);
        const idx = (py * W + px) * 4;
        data[idx]     = Math.min(255, r);
        data[idx + 1] = Math.min(255, g);
        data[idx + 2] = Math.min(255, b);
        data[idx + 3] = 255;
      }
    }
    ctx.putImageData(image, 0, 0);
  }

  // -- Palette injection --
  let cycleHue = 0;
  function colorFor(t) {
    // t: normalized hue / parameter
    let r, g, b;
    if (palette === 'rainbow') {
      const h = (t * 360) % 360;
      [r, g, b] = hsv2rgb(h, 0.9, 1);
    } else if (palette === 'fire') {
      r = 255;
      g = Math.max(0, Math.min(255, 255 * (t * 2 - 0.2)));
      b = Math.max(0, Math.min(255, 255 * (t - 0.7) * 3));
    } else if (palette === 'ocean') {
      r = Math.max(0, Math.min(255, 50 * t));
      g = Math.max(0, Math.min(255, 180 * t));
      b = Math.max(0, Math.min(255, 80 + 175 * t));
    } else if (palette === 'mono') {
      r = g = b = 230;
    } else { // cycle
      const h = (cycleHue + t * 90) % 360;
      [r, g, b] = hsv2rgb(h, 0.9, 1);
    }
    return [r, g, b];
  }

  function hsv2rgb(h, s, v) {
    const c = v * s;
    const hh = (h % 360) / 60;
    const x = c * (1 - Math.abs(hh % 2 - 1));
    let r = 0, g = 0, b = 0;
    if (hh < 1)      [r, g, b] = [c, x, 0];
    else if (hh < 2) [r, g, b] = [x, c, 0];
    else if (hh < 3) [r, g, b] = [0, c, x];
    else if (hh < 4) [r, g, b] = [0, x, c];
    else if (hh < 5) [r, g, b] = [x, 0, c];
    else             [r, g, b] = [c, 0, x];
    const m = v - c;
    return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
  }

  // -- Input handling --
  let mouseDown = false;
  let lastX = 0, lastY = 0;
  let injectQueue = [];

  function pointer(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return {
      x: cx * (canvas.width / rect.width),
      y: cy * (canvas.height / rect.height),
    };
  }

  canvas.addEventListener('mousedown', e => {
    mouseDown = true;
    const p = pointer(e);
    lastX = p.x; lastY = p.y;
  });
  canvas.addEventListener('mouseup', () => { mouseDown = false; });
  canvas.addEventListener('mouseleave', () => { mouseDown = false; });
  canvas.addEventListener('mousemove', e => {
    if (!mouseDown) return;
    const p = pointer(e);
    injectQueue.push({ x: p.x, y: p.y, dx: p.x - lastX, dy: p.y - lastY });
    lastX = p.x; lastY = p.y;
  });

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    mouseDown = true;
    const p = pointer(e);
    lastX = p.x; lastY = p.y;
  }, { passive: false });
  canvas.addEventListener('touchend', () => { mouseDown = false; });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!mouseDown) return;
    const p = pointer(e);
    injectQueue.push({ x: p.x, y: p.y, dx: p.x - lastX, dy: p.y - lastY });
    lastX = p.x; lastY = p.y;
  }, { passive: false });

  function injectFromQueue() {
    if (injectQueue.length === 0) return;
    for (const ev of injectQueue) {
      const gi = Math.max(1, Math.min(N, Math.floor(ev.x / cellW)));
      const gj = Math.max(1, Math.min(N, Math.floor(ev.y / cellH)));
      const fx = ev.dx * forceScale * 0.4;
      const fy = ev.dy * forceScale * 0.4;
      // brush
      const radius = 2;
      // color sampled from velocity direction
      const angle = Math.atan2(ev.dy, ev.dx);
      const t = ((angle / (Math.PI * 2)) + 1) % 1;
      const [cr, cg, cb] = colorFor(t);
      const intensity = 120;
      for (let dj = -radius; dj <= radius; dj++) {
        for (let di = -radius; di <= radius; di++) {
          const ii = gi + di;
          const jj = gj + dj;
          if (ii < 1 || ii > N || jj < 1 || jj > N) continue;
          const falloff = Math.exp(-(di*di + dj*dj) / 2.5);
          u[IX(ii, jj)] += fx * falloff;
          v[IX(ii, jj)] += fy * falloff;
          dR[IX(ii, jj)] += cr * falloff * (intensity / 255);
          dG[IX(ii, jj)] += cg * falloff * (intensity / 255);
          dB[IX(ii, jj)] += cb * falloff * (intensity / 255);
        }
      }
    }
    injectQueue.length = 0;
  }

  // -- Decay to prevent saturation --
  function decay(arr, k) {
    for (let i = 0; i < arr.length; i++) arr[i] *= k;
  }

  // -- Main loop --
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    if (palette === 'cycle') cycleHue = (cycleHue + 30 * dt) % 360;

    injectFromQueue();

    // velocity step
    [u_prev, u] = [u, u_prev]; // not actually needed but cheap
    vel_step(u, v, u_prev, v_prev, visc, dt);
    dens_step(dR, dR_prev, u, v, diff, dt);
    dens_step(dG, dG_prev, u, v, diff, dt);
    dens_step(dB, dB_prev, u, v, diff, dt);

    // gentle decay
    decay(dR, 0.995);
    decay(dG, 0.995);
    decay(dB, 0.995);
    decay(u, 0.99);
    decay(v, 0.99);

    render();
    requestAnimationFrame(frame);
  }

  // -- UI bindings --
  const viscEl = document.getElementById('viscosity');
  const diffEl = document.getElementById('diffusion');
  const forceEl = document.getElementById('force');
  const paletteEl = document.getElementById('palette');
  const viscValue = document.getElementById('viscValue');
  const diffValue = document.getElementById('diffValue');
  const forceValue = document.getElementById('forceValue');

  function refreshLabels() {
    viscValue.textContent = visc.toFixed(4);
    diffValue.textContent = diff.toFixed(5);
    forceValue.textContent = forceScale.toFixed(0);
  }
  refreshLabels();

  viscEl.addEventListener('input', e => {
    visc = parseFloat(e.target.value);
    refreshLabels();
  });
  diffEl.addEventListener('input', e => {
    diff = parseFloat(e.target.value);
    refreshLabels();
  });
  forceEl.addEventListener('input', e => {
    forceScale = parseFloat(e.target.value);
    refreshLabels();
  });
  paletteEl.addEventListener('change', e => {
    palette = e.target.value;
  });

  document.getElementById('reset').addEventListener('click', () => {
    allocate();
  });

  // seed a small puff so the canvas is not empty
  (function seed() {
    const cx = (N >> 1), cy = (N >> 1);
    for (let dj = -8; dj <= 8; dj++) {
      for (let di = -8; di <= 8; di++) {
        const f = Math.exp(-(di*di + dj*dj) / 18);
        dR[IX(cx + di, cy + dj)] += 180 * f;
        dG[IX(cx + di, cy + dj)] += 80 * f;
        dB[IX(cx + di, cy + dj)] += 200 * f;
        u[IX(cx + di, cy + dj)] += 0.5 * f;
        v[IX(cx + di, cy + dj)] += -0.3 * f;
      }
    }
  })();

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
